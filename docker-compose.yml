services:
  db:
    image: postgres:16
    container_name: finportfolio_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: finportfolio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  web:
    build: .
    container_name: finportfolio_web
    restart: unless-stopped
    depends_on:
      - db
    environment:
      POSTGRES_DB: finportfolio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      T_INVEST_TOKEN: "Токен из Т Инвестиции"
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  postgres_data: